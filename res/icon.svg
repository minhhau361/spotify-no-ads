<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="208"/></clipPath>
  </defs>
  <g transform="translate(256 256) scale(1) translate(-256 -256)">
    <g clip-path="url(#disc)">
      <rect x="-500" y="-500" width="1512" height="1512" fill="#1DB954"/>
    </g>
    <!-- Spotify logo: white circle background logo? Actually Spotify icon is green with black curves -->
    <g id="spotify-logo">
      <!-- Black outer circle like original style, but with Spotify curves -->
      <!-- Use white icon on green bg for best contrast like official -->
      <circle cx="256" cy="256" r="94.5" fill="#000000" stroke="#000000" stroke-width="4"/>
      <!-- 3 arcs -->
      <path d="M 180 220 Q 256 190 340 220" fill="none" stroke="#1DB954" stroke-width="16" stroke-linecap="round"/>
      <path d="M 185 250 Q 256 225 335 250" fill="none" stroke="#1DB954" stroke-width="14" stroke-linecap="round"/>
      <path d="M 190 280 Q 256 260 330 280" fill="none" stroke="#1DB954" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>
</svg>
