name: Build Spotify No Ads

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'
  schedule:
    - cron: '0 0 */16 * *'
  push:
    branches: [ main, master ]
    paths:
      - 'patch.sh'
      - 'args.gn'
      - 'extensions/**'
      - '.gclient'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      
      - name: Update Vanadium
        run: |
          if [ ! -d vanadium/.git ]; then
            echo "Cloning Vanadium (submodule missing)..."
            rm -rf vanadium
            git clone --depth 1 https://github.com/GrapheneOS/Vanadium.git vanadium
          fi
          cd vanadium
          git fetch --tags --depth 1 || git fetch --tags
          git checkout $(git tag | sort -V | tail -n1) || echo "checkout latest tag failed"
          cd ..
          git add vanadium || true
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "chore: update vanadium" || true
            git push || echo "push failed, maybe no permission"
          fi

      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
    
      - name: Build
        env:
            DEBIAN_FRONTEND: noninteractive
            LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
            STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          ./build.sh

      - name: Collect Artifacts
        run: |
          export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//' | head -n1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION"
          ls -lh chromium/src/out/release/
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab || true
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk || true
          mv $(find chromium/src/out/release -name '*armeabi-v7a.apk') $VERSION-${{ env.unix_time }}-armeabi-v7a.apk || true
          # fallback if naming differs
          VERSION=${VERSION:-spotify-$(date +%Y%m%d)}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -lh *.apk *.aab 2>&1 || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Spotify No Ads v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}-${{ env.unix_time }}
          files: |
            *.apk
            *.aab
          generate_release_notes: true

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.apk
            *.aab
